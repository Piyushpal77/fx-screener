[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-screener"
version = "1.1.0"
description = "Multi-Factor FX & Precious Metals Screener with Interactive W1/D1/H4/H1 Charts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "textual>=0.80",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
fx-screener = "fx_screener.__main__:main"
fx-screener2 = "fx_screener2.__main__:main"

[tool.setuptools.packages.find]
include = ["fx_screener*", "fx_screener2*"]
